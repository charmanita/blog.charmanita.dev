name: Notify subscribers

on:
  push:
    branches:
      - main
    paths:
      - "src/posts/**"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployment
        run: sleep 30
        
      - name: Call notify worker
        run: curl -X POST https://notify.blog.charmanita.dev/ -H "X-Secret: ${{ secrets.NOTIFY_SECRET }}"
